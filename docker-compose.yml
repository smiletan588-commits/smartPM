services:
  # ── MySQL 8.0 ──────────────────────────────────────────
  mysql:
    image: ${DOCKER_REGISTRY_MIRROR:-m.daocloud.io/docker.io}/library/mysql:8.0
    container_name: smartpm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: smartpm
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smartpm-net
    restart: unless-stopped

  # ── Redis 7 ────────────────────────────────────────────
  redis:
    image: ${DOCKER_REGISTRY_MIRROR:-m.daocloud.io/docker.io}/library/redis:7-alpine
    container_name: smartpm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpm-net
    restart: unless-stopped

  # ── Spring Boot 后端 ───────────────────────────────────
  backend:
    build:
      context: .
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY_MIRROR:-m.daocloud.io/docker.io}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: smartpm-backend
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - REDIS_HOST=redis
      - AI_API_KEY=${AI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-smartpm-docker-development-secret-change-before-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-SmartPM@2026}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_AUTH=${SMTP_AUTH:-true}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartpm-net
    restart: unless-stopped

  # ── Nginx（前端静态资源 + 反向代理）───────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY_MIRROR:-m.daocloud.io/docker.io}
    container_name: smartpm-nginx
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartpm-net
    restart: unless-stopped

# ── 持久化卷 ─────────────────────────────────────────────
volumes:
  mysql-data:
  redis-data:

# ── 内部网络 ─────────────────────────────────────────────
networks:
  smartpm-net:
    driver: bridge
