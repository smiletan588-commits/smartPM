<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>SmartPM 标志概念</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#172238;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
main{width:1040px;margin:auto;padding:48px 56px}header{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:2px;color:#68758b}header b{color:#172238}
.hero{height:290px;display:flex;align-items:center;justify-content:center;background:white;margin:24px 0 18px;border-radius:16px}.hero img{width:450px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}.tile{height:166px;border-radius:12px;background:white;display:flex;align-items:center;justify-content:center;position:relative}.tile.dark{background:#172238}.tile.blue{background:#315cf4}.tile img{height:58px}.tile.dark img{width:225px;height:auto}.tile.blue img{filter:brightness(0) invert(1)}
.label{position:absolute;left:20px;bottom:14px;color:#7d899b;font-size:11px;letter-spacing:1px}.dark .label,.blue .label{color:#ccd6f0}
footer{margin-top:26px;display:flex;align-items:start;justify-content:space-between;font-size:13px;color:#68758b;line-height:1.8}footer strong{font-size:18px;font-weight:500;color:#172238}footer p{margin:3px 0 0}.mini{display:flex;gap:16px;align-items:center}.mini img{width:24px;height:26px}
</style><main><header><b>SMARTPM / BRAND CONCEPT</b><span>01 · 协作路径</span></header>
<section class="hero"><img src="smartpm-logo.svg" alt="SmartPM主标志"></section>
<section class="row"><div class="tile"><img src="smartpm-icon.svg" alt="独立图标"><span class="label">独立图标</span></div><div class="tile dark"><img src="smartpm-logo-white.svg" alt="深色背景反白标志"><span class="label">深色背景</span></div><div class="tile blue"><img src="smartpm-icon.svg" alt="蓝底反白图标"><span class="label">应用图标</span></div></section>
<footer><div><strong>让协作沿着清晰的路径前进。</strong><p>S形折返路径 · 三段任务进程 · 钴蓝与冷灰</p></div><div class="mini"><img src="smartpm-icon.svg" alt="24像素图标"><span>24px 小尺寸预览<br>设计提案，尚未应用到系统</span></div></footer></main></html>
